<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>CarritoWeb - Carrito</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header id="cabecera"></header>

  <script>
    fetch('marco.html')
      .then(res => res.text())
      .then(data => {
        document.getElementById('cabecera').innerHTML = data;
      });
  </script>

  <main class="contenedor">
    <section>
      <h2>Resumen del carrito</h2>
      <p>
        Esta página muestra el carrito obtenido desde la API REST.
      </p>
      <p id="mensaje-carrito"></p>
    </section>

    <section>
      <h2>Productos en el carrito</h2>
      <table>
        <thead>
          <tr>
            <th>Producto</th>
            <th>Precio unitario</th>
            <th>Cantidad</th>
            <th>Subtotal</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="tabla-carrito-body">
        </tbody>
        <tfoot>
          <tr>
            <th colspan="3">Total</th>
            <th id="total-carrito">0 €</th>
            <th></th>
          </tr>
        </tfoot>
      </table>
    </section>

    <section class="destacado">
      <h2>Información adicional</h2>
      <p>Estado del carrito: <span id="estado-carrito">vacío</span>.</p>
      <p>Número de líneas: <span id="numero-lineas">0</span>.</p>
      <p>Descuento aplicado: ninguno.</p>
      <p>
        <a href="productos.html">Seguir comprando</a>
        <a href="pedido.html">Ir a pedido</a>
      </p>
    </section>
  </main>

  <script src="app.js"></script>
  <script>
    async function cargarCarrito() {
      const tbody = document.getElementById("tabla-carrito-body");
      const total = document.getElementById("total-carrito");
      const estado = document.getElementById("estado-carrito");
      const numeroLineas = document.getElementById("numero-lineas");
      const mensaje = document.getElementById("mensaje-carrito");

      try {
        const carrito = await obtenerCarritoActual();

        if (!carrito || carrito.lineas.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="5">El carrito está vacío.</td>
            </tr>
          `;
          total.textContent = "0 €";
          estado.textContent = "vacío";
          numeroLineas.textContent = "0";
          return;
        }

        tbody.innerHTML = carrito.lineas.map(linea => {
          const producto = PRODUCTOS[linea.idArticulo];
          const nombre = producto ? producto.nombre : `Artículo ${linea.idArticulo}`;

          return `
            <tr>
              <td>${nombre}</td>
              <td>${formatearPrecio(linea.precioUnitario)}</td>
              <td>${linea.unidades}</td>
              <td>${formatearPrecio(linea.costeLineaArticulo)}</td>
              <td>
                <button type="button" class="btn-eliminar" data-id="${linea.idArticulo}">
                  Eliminar
                </button>
              </td>
            </tr>
          `;
        }).join("");

        total.textContent = formatearPrecio(carrito.totalPrecio);
        estado.textContent = "activo";
        numeroLineas.textContent = carrito.lineas.length;

        document.querySelectorAll(".btn-eliminar").forEach(boton => {
          boton.addEventListener("click", async () => {
            const idArticulo = Number(boton.dataset.id);

            try {
              await eliminarLinea(idArticulo);
              await cargarCarrito();
            } catch (error) {
              mensaje.textContent = "Error al eliminar la línea: " + error.message;
            }
          });
        });

      } catch (error) {
        mensaje.textContent = "Error al cargar el carrito: " + error.message;
      }
    }

    cargarCarrito();
  </script>
</body>
</html>
